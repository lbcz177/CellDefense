<script>
'use strict';
const assets=JSON.parse(document.getElementById('asset-data').textContent);
const gallery=document.getElementById('gallery'),search=document.getElementById('search'),category=document.getElementById('category'),viewer=document.getElementById('viewer');
let visible=assets.slice(),activeIndex=0;
const fileUrl=path=>path.split('/').map(encodeURIComponent).join('/');
const title=asset=>asset.name.replaceAll('_',' ');
const groupTitle=group=>group.replace(/^\d+_/,'');
function addLink(parent,label,path,isExternal=false){
 const link=document.createElement('a');link.textContent=label;link.href=isExternal?path:fileUrl(path);link.target='_blank';link.rel='noopener';parent.append(link);
}
function assetLinks(parent,asset){
 addLink(parent,'打开原图',asset.selectedFile);
 if(asset.revised)addLink(parent,'查看初版',asset.originalFile);
 if(asset.promptFile)addLink(parent,'提示词',asset.promptFile);
 if(asset.sourceUrl)addLink(parent,'笔记来源',asset.sourceUrl,true);
}
for(const group of [...new Set(assets.map(a=>a.group))]){
 const option=document.createElement('option');option.value=group;option.textContent=groupTitle(group)+' · '+assets.filter(a=>a.group===group).length;category.append(option);
}
function render(){
 const query=search.value.trim().toLocaleLowerCase();
 visible=assets.filter(a=>(!category.value||a.group===category.value)&&(!query||[a.name,a.group,a.id].join(' ').toLocaleLowerCase().includes(query)));
 gallery.replaceChildren();
 document.getElementById('result-count').textContent='显示 '+visible.length+' / '+assets.length+' 项素材';
 visible.forEach((asset,index)=>{
  const card=document.createElement('article');card.className='card';
  const button=document.createElement('button');button.className='preview';button.type='button';button.setAttribute('aria-label','放大查看 '+title(asset));
  const img=document.createElement('img');img.src=fileUrl(asset.selectedFile);img.alt=title(asset);img.loading='lazy';img.decoding='async';button.append(img);
  if(asset.revised||asset.reused){const badge=document.createElement('span');badge.className='badge'+(asset.revised?' revised':'');badge.textContent=asset.revised?'修正版 v2':'已有素材';button.append(badge);}
  button.addEventListener('click',()=>show(index));card.append(button);
  const info=document.createElement('div');info.className='info';
  const meta=document.createElement('div');meta.className='meta';meta.textContent=asset.id+' · '+groupTitle(asset.group)+' · '+asset.width+' × '+asset.height;
  const heading=document.createElement('h2');heading.textContent=title(asset);
  const links=document.createElement('div');links.className='links';addLink(links,'打开原图',asset.selectedFile);
  if(asset.revised)addLink(links,'查看初版',asset.originalFile);else if(asset.promptFile)addLink(links,'提示词',asset.promptFile);
  info.append(meta,heading,links);card.append(info);gallery.append(card);
 });
 if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='没有找到匹配素材，请更换关键词或分类。';gallery.append(empty);}
}
function show(index){
 if(!visible.length)return;activeIndex=(index+visible.length)%visible.length;const asset=visible[activeIndex];
 document.getElementById('viewer-title').textContent=title(asset);
 document.getElementById('viewer-meta').textContent=(activeIndex+1)+' / '+visible.length+' · '+groupTitle(asset.group)+' · '+asset.width+' × '+asset.height+(asset.revised?' · 修正版 v2':'');
 const large=document.getElementById('large-image');large.src=fileUrl(asset.selectedFile);large.alt=title(asset);
 const links=document.getElementById('viewer-links');links.replaceChildren();assetLinks(links,asset);
 if(!viewer.open)viewer.showModal();
}
search.addEventListener('input',render);category.addEventListener('change',render);
document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{
 document.body.dataset.preview=button.dataset.bg;document.querySelectorAll('[data-bg]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
}));
document.getElementById('close').addEventListener('click',()=>viewer.close());
document.getElementById('previous').addEventListener('click',()=>show(activeIndex-1));
document.getElementById('next').addEventListener('click',()=>show(activeIndex+1));
viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close();}});
viewer.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();show(activeIndex-1);}if(event.key==='ArrowRight'){event.preventDefault();show(activeIndex+1);}});
render();
</script>
</body>
</html>
